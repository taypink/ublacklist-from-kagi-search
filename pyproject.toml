[project]
name = "ublacklist-from-kagi-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "taypink", email = "yiqingchents@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.scripts]
ublacklist-from-kagi-search = "ublacklist_from_kagi_search:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.nju.edu.cn/pypi/web/simple"
default = true

[tool.uv]
allow-insecure-host = ["mirrors.nju.edu.cn"]
